name: Build and validate BackgroundMusic

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze source and verify PHAR contents
    runs-on: ubuntu-24.04
    steps:
      - name: Check out BackgroundMusic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1 # 5.51.1
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Check out minimum declared Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: b16cc69974d4e805d21e6328ab77c0e17cd7116d # 5.0.0
          path: .devtools-dependencies/axolotl-pm-5.0.0
          persist-credentials: false

      - name: Set up Axolotl-PM PHP environment
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: "8.4"
          pm-version-major: "5"
          install-path: ./.php-bin

      - name: Lint plugin PHP source and fixture
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check playback task lifecycle
        run: php tests/scheduler-lifecycle.php

      - name: Analyze source and build PHAR with DevTools
        id: build
        uses: NhanAZ/DevTools@v2 # v2
        with:
          project: .
          output: build
          phpstan: max
          phpstan-server: |
            .devtools-dependencies/axolotl-pm-5.0.0
            .devtools-dependencies/axolotl-pm

      - name: Verify PHAR checksum and plugin entries
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          PHAR_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$PHAR_PATH" | cut -d ' ' -f 1)" = "$PHAR_SHA256"
          php -r '$p=new Phar(getenv("PHAR_PATH")); foreach(["plugin.yml","LICENSE","src/NhanAZ/BackgroundMusic/Main.php"] as $entry){if(!$p->offsetExists($entry)){throw new RuntimeException("Missing PHAR entry: ".$entry);}} foreach($p as $entry){if(str_starts_with($entry->getPathName(), "resources/")){throw new RuntimeException("Unexpected bundled resource: ".$entry->getPathName());}}'

      - name: Upload verified plugin PHAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BackgroundMusic-${{ github.sha }}
          path: ${{ steps.build.outputs.phar }}
          if-no-files-found: error
          retention-days: 14
